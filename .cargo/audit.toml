# cargo audit 설정. CI의 audit 잡이 쓴다.

[advisories]
# zip 8.x의 압축 해제 취약점. 데스크톱 업데이터(Velopack 1.2)만 쓴다.
# 업데이터는 받은 패키지의 SHA256을 서명된 업데이트 정책과 맞춘 뒤에만 압축을 푼다
# (crates/aragorn-desktop/src/adapters/velopack_updater.rs). 그래서 정책 서명 키 없이는
# 악성 zip을 넣을 수 없다. zip 9를 쓰는 Velopack은 아직 프리릴리스(1.3.39-g8d2844f)뿐이라,
# 정식판이 나오면 Velopack을 올리고 이 줄을 지운다. (2026-10-18)
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
