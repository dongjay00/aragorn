name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 태그와 워크스페이스 버전 일치 확인
        run: cargo xtask check-tag "${GITHUB_REF_NAME}"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            exe: aragorn.exe
            channel: win
            icon: crates/aragorn-desktop/assets/icon/aragorn.ico
          - os: macos-latest
            exe: aragorn
            channel: osx
            icon: crates/aragorn-desktop/assets/icon/aragorn.icns
          - os: ubuntu-22.04
            exe: aragorn
            channel: linux
            icon: crates/aragorn-desktop/assets/icon/aragorn.png
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARAGORN_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux 빌드 의존성
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libudev-dev
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p aragorn-desktop
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: vpk 설치 (velopack 크레이트와 같은 버전)
        shell: bash
        run: |
          VPK_VERSION="$(cargo pkgid velopack | sed 's/.*[@#]//')"
          dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: 패키징
        shell: bash
        run: |
          mkdir publish
          cp "target/release/${{ matrix.exe }}" publish/
          # 채널 이름은 앱의 PACKAGE_CHANNEL(win/osx/linux)과 같아야 한다.
          vpk pack --packId Aragorn --packVersion "$VERSION" --packDir publish \
            --mainExe "${{ matrix.exe }}" --packTitle Aragorn --channel "${{ matrix.channel }}" --icon "${{ matrix.icon }}" \
            --outputDir Releases
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.channel }}
          path: Releases/*
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARAGORN_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 구성 요소 (app/build.gradle.kts의 ndkVersion, compileSdk와 같다)
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;29.0.14206865" "platforms;android-37.0" < <(yes) > /dev/null
      - name: cargo-ndk 설치
        run: cargo install cargo-ndk --locked
      # 서명 키를 복원하기 전에 Rust 라이브러리를 빌드해, 의존성 빌드 스크립트가 키에 접근하지 못하게 한다.
      # 아래 Gradle 빌드가 같은 명령을 다시 부르지만 이미 빌드되어 있어 바로 끝난다.
      - name: Rust 라이브러리 빌드
        shell: bash
        # Gradle과 같은 NDK를 써야 Gradle 단계에서 다시 빌드하지 않는다.
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" cargo xtask android --release
      # 디버그 키로 서명한 APK는 다음 릴리스로 업데이트할 수 없으므로, 키가 없으면 릴리스를 멈춘다.
      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.ARAGORN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ARAGORN_ANDROID_KEYSTORE_BASE64 시크릿이 없습니다"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: 릴리스 APK 빌드
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ARAGORN_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ARAGORN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARAGORN_ANDROID_KEYSTORE_PASSWORD }}
          ARAGORN_ANDROID_KEY_ALIAS: ${{ secrets.ARAGORN_ANDROID_KEY_ALIAS }}
          ARAGORN_ANDROID_KEY_PASSWORD: ${{ secrets.ARAGORN_ANDROID_KEY_PASSWORD }}
      # 파일 이름은 xtask의 apk_name과 같아야 정책에 android 패키지로 들어간다.
      - name: APK 이름 정하기
        run: |
          mkdir apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "apk/Aragorn-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: apk/*
          if-no-files-found: error

  publish:
    needs: [prepare, package, android]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 서명 키가 없는 단계에서 빌드해, 의존성 빌드 스크립트가 키에 접근하지 못하게 한다.
      - name: xtask 빌드
        run: cargo build --locked -p xtask
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 패키지 모으기 (파일 이름 충돌 시 실패)
        run: |
          mkdir dist
          for f in artifacts/*/*; do
            name="$(basename "$f")"
            if [ -e "dist/$name" ]; then echo "중복 파일: $name"; exit 1; fi
            cp "$f" "dist/$name"
          done
          ls -l dist
      # 데스크톱 피드(releases.*.json)와 Aragorn-<버전>.apk의 해시를 정책에 넣는다.
      - name: 업데이트 정책 생성과 서명
        run: target/debug/xtask make-policy dist dist
        env:
          ARAGORN_POLICY_SIGNING_KEY: ${{ secrets.ARAGORN_POLICY_SIGNING_KEY }}
      # 모든 패키지와 서명된 정책을 한 번에 올리고 공개한다.
      - name: 릴리스 공개
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Aragorn ${VERSION}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
